[tool.ruff]
line-length = 100
target-version = "py310"
# Alembic revision files are generated and must not change after being applied.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
